name: Build unsigned iOS IPA

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

env:
  CMAKE_POLICY_VERSION_MINIMUM: "3.5"
  VCPKG_KEEP_ENV_VARS: CMAKE_POLICY_VERSION_MINIMUM

jobs:
  build-ios:
    name: Build iOS (Unsigned)
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Full history is required: vcpkg resolves "builtin-baseline" and the
          # pinned port versions (mbedtls 2.28.8, curl 8.7.1) from git history.
          fetch-depth: 0
          submodules: recursive

      - name: Fetch vcpkg history and baseline
        shell: bash
        run: |
          set -euo pipefail
          manifest="vcpkg.json"
          baseline="$(sed -nE 's/.*"builtin-baseline":[[:space:]]*"([0-9a-f]{40})".*/\1/p' "${manifest}" | head -n1)"

          if [ -z "${baseline}" ]; then
            echo "Unable to determine vcpkg builtin-baseline from ${manifest}"
            exit 1
          fi

          if git -C extern/vcpkg rev-parse --is-shallow-repository | grep -q true; then
            git -C extern/vcpkg fetch --force --prune --tags --unshallow origin \
              "+refs/heads/*:refs/remotes/origin/*"
          else
            git -C extern/vcpkg fetch --force --prune --tags origin \
              "+refs/heads/*:refs/remotes/origin/*"
          fi

          if ! git -C extern/vcpkg cat-file -e "${baseline}^{commit}" 2>/dev/null; then
            git -C extern/vcpkg fetch --force origin "${baseline}"
          fi

          git -C extern/vcpkg cat-file -e "${baseline}^{commit}"

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version

      - name: Install dependencies
        run: |
          brew install cmake ninja pkg-config nasm autoconf automake libtool || true
          nasm -v

      - name: Build libromfs generator (host / macOS)
        run: |
          # The generator must run on the CI machine while building. It has to be
          # compiled for macOS, NOT for iOS, otherwise the Xcode build produces an
          # iOS .app that cannot be executed ("No such file or directory").
          set -euo pipefail
          cmake -S extern/borealis/library/lib/extern/libromfs/generator \
            -B build_libromfs_generator \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_SYSROOT=macosx
          cmake --build build_libromfs_generator --config Release
          cp build_libromfs_generator/libromfs-generator "$GITHUB_WORKSPACE/libromfs-generator"
          chmod +x "$GITHUB_WORKSPACE/libromfs-generator"
          file "$GITHUB_WORKSPACE/libromfs-generator"
          rm -rf build_libromfs_generator

      - name: Bootstrap vcpkg
        working-directory: extern/vcpkg
        run: |
          chmod +x bootstrap-vcpkg.sh
          ./bootstrap-vcpkg.sh -disableMetrics

      - name: Compute vcpkg cache key
        id: vcpkg-cache-key
        shell: bash
        run: |
          vcpkg_revision="$(git -C extern/vcpkg rev-parse HEAD)"
          manifest_hash="${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'extern/cmake/vcpkg-triplets/arm64-ios.cmake') }}"
          echo "key=iOS-arm64-vcpkg-${vcpkg_revision}-${manifest_hash}" >> "$GITHUB_OUTPUT"
          echo "restore-prefix=iOS-arm64-vcpkg-${vcpkg_revision}-" >> "$GITHUB_OUTPUT"

      - name: Restore vcpkg cache
        uses: actions/cache@v4
        with:
          path: |
            extern/vcpkg/buildtrees
            extern/vcpkg/downloads
            extern/vcpkg/packages
            build/ios/vcpkg_installed
          key: ${{ steps.vcpkg-cache-key.outputs.key }}
          restore-keys: |
            ${{ steps.vcpkg-cache-key.outputs.restore-prefix }}

      - name: Configure iOS project
        run: |
          # DEVICE only: an unsigned IPA does not need the simulator triplet,
          # which would otherwise double the vcpkg build (ffmpeg etc.).
          cmake -B build/ios \
            -G Xcode \
            -DPLATFORM_IOS=ON \
            -DAPPLE_MOBILE_SDK_VARIANT=DEVICE \
            -DCMAKE_BUILD_TYPE=Release \
            -DLIBROMFS_PREBUILT_GENERATOR="$GITHUB_WORKSPACE/libromfs-generator" \
            -DVCPKG_OVERLAY_TRIPLETS="$GITHUB_WORKSPACE/extern/cmake/vcpkg-triplets"

      - name: Build iOS application
        run: |
          cmake --build build/ios \
            --config Release \
            --parallel $(sysctl -n hw.ncpu) \
            -- -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""

      - name: Package unsigned IPA
        shell: bash
        run: |
          set -euo pipefail

          APP=$(find build/ios/Release-iphoneos -maxdepth 2 -type d -name "*.app" -print -quit 2>/dev/null || true)
          if [ -z "$APP" ]; then
            APP=$(find build/ios -type d -name "*.app" -print -quit)
          fi

          if [ -z "$APP" ]; then
            echo "ERROR: No .app bundle found!"
            find build/ios -maxdepth 5 -type d -print
            exit 1
          fi

          echo "Found application: $APP"

          rm -rf Payload dist
          mkdir -p Payload dist
          cp -R "$APP" Payload/
          zip -qry dist/Luma-unsigned.ipa Payload

          echo "IPA successfully created:"
          ls -lh dist/

      - name: Upload iOS build logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Luma-iOS-build-logs
          path: |
            build/ios/vcpkg-manifest-install.log
            build/ios/CMakeFiles/CMakeError.log
            build/ios/CMakeFiles/CMakeOutput.log
            extern/vcpkg/buildtrees/**/*.log
          if-no-files-found: ignore

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: Luma-unsigned-IPA
          path: dist/Luma-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
