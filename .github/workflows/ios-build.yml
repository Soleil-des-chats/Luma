
name: Build unsigned iOS IPA

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-ios:
    name: Build iOS (Unsigned)
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version

      - name: Install dependencies
        run: |
          brew install cmake ninja pkg-config

      - name: Build libromfs generator
        run: |
          chmod +x build_libromfs_generator.sh
          ./build_libromfs_generator.sh

      - name: Bootstrap vcpkg
        run: |
          ./extern/vcpkg/bootstrap-vcpkg.sh

      - name: Configure iOS project
        run: |
          cmake -B build/ios \
            -G Xcode \
            -DPLATFORM_IOS=ON \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build iOS application
        run: |
          cmake --build build/ios \
            --config Release \
            --parallel $(sysctl -n hw.ncpu)

      - name: Package unsigned IPA
        shell: bash
        run: |
          set -euo pipefail

          APP=$(find build/ios \
            -type d \
            -name "*.app" \
            -print -quit)

          if [ -z "$APP" ]; then
            echo "ERROR: No .app bundle found!"
            find build/ios -maxdepth 5 -type d -print
            exit 1
          fi

          echo "Found application: $APP"

          mkdir -p Payload
          cp -R "$APP" Payload/

          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent \
            Payload dist/Luma-unsigned.ipa

          echo "IPA successfully created:"
          ls -lh dist/

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: Luma-unsigned-IPA
          path: dist/Luma-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
